services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: fintech_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    networks:
      - iselftoken_network

networks:
  iselftoken_network:
    external: true
