services:
  api:
    container_name: backendnode_api
    build:
      context: ..
      dockerfile: docker/DockerFile
    env_file:
      - ../.env
    ports:
      - 7077:7077
    volumes:
      - ../documents:/usr/src/app/documents
    restart: unless-stopped
    networks:
      - iselftoken_network

networks:
  iselftoken_network:
    external: true
