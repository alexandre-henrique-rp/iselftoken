name: E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "backendnode/src/**/*.ts"
      - "backendnode/test/e2e/**/*.ts"
      - "frontend/src/**/*.ts"
      - "frontend/test/e2e/**/*.ts"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backendnode/src/**/*.ts"
      - "backendnode/test/e2e/**/*.ts"
      - "frontend/src/**/*.ts"
      - "frontend/test/e2e/**/*.ts"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Backend E2E — PIX EFI + Coupon + Webhook Security
  # ==========================================================================
  backend-e2e:
    name: Backend E2E (NestJS + Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: iselftoken_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: backendnode/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backendnode

      - name: Prisma setup (SQLite dev)
        run: pnpm prisma:setup
        working-directory: backendnode
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:./prisma/dev.db

      - name: Build
        run: pnpm build
        working-directory: backendnode

      # EFI Mock Server via docker compose
      - name: Start EFI Mock Server
        run: |
          docker run -d --name efi-mock \
            -p 7078:7078 \
            -e EFI_WEBHOOK_HMAC_SECRET=test-hmac-secret \
            ghcr.io/iselftoken/efi-mock-server:latest || true

      - name: Wait for EFI Mock
        run: |
          for i in $(seq 1 10); do
            nc -z localhost 7078 && echo "EFI Mock ready" && break
            sleep 2
          done

      - name: Run Backend E2E (PIX EFI + Coupon + Webhook)
        run: pnpm test:e2e:flows -- --testPathPattern='pix-efi|coupon-apply|webhook-efi' --coverage
        working-directory: backendnode
        env:
          NODE_ENV: test
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:./prisma/dev.db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          EFI_MODE: sandbox
          EFI_BASE_URL: http://localhost:7078
          EFI_WEBHOOK_HMAC_SECRET: test-hmac-secret
          EFI_CLIENT_ID: test_client_id
          EFI_CLIENT_SECRET: test_client_secret

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backendnode/coverage
          retention-days: 7

  # ==========================================================================
  # Frontend E2E — Playwright (Checkout PIX + Card + Cupons)
  # ==========================================================================
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: iselftoken_test
        ports:
          - 3306:3306

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # Start backend (needed for BFF proxies)
      - name: Start Backend
        run: |
          cd backendnode
          pnpm install --frozen-lockfile
          pnpm prisma:setup
          pnpm build
          pnpm start:prod &
          sleep 10
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:./prisma/dev.db

      # Start Frontend dev server
      - name: Start Frontend
        run: |
          pnpm build || true
          pnpm dev &
          sleep 10
        working-directory: frontend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Frontend E2E
        run: pnpm test:e2e:playwright --grep='checkout|coupons'
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 14

      - name: Upload Playwright Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: frontend/test-results/**/video.webm
          retention-days: 7

  # ==========================================================================
  # Smoke Test — API endpoints respondem
  # ==========================================================================
  smoke-test:
    name: Smoke Test (API health)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and Build
        run: |
          cd backendnode
          pnpm install --frozen-lockfile
          pnpm prisma:setup
          pnpm build

      - name: Start Backend
        run: pnpm start:prod &
        working-directory: backendnode
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:./prisma/dev.db

      - name: Wait for Backend
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:7077/health && echo "Backend ready" && break
            sleep 2
          done

      - name: Smoke Test — Health
        run: curl -sf http://localhost:7077/health | grep -q '"status"' && echo "OK"

      - name: Smoke Test — Plans
        run: curl -sf http://localhost:7077/plans | grep -q 'data'

      - name: Smoke Test — OpenAPI
        run: curl -sf http://localhost:7077/docs-json | grep -q 'openapi'
